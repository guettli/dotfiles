[kubernetes]
disabled = false

[golang]
disabled = true

[gcloud]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[direnv]
disabled = false
symbol = ""
allowed_msg = ""
loaded_msg = ""
not_allowed_msg = " 🚫 not allowed"
denied_msg = " 🔒 denied"
unloaded_msg = " 🌪 not loaded"
format = "[$symbol$loaded$allowed]($style) "
style = "bold yellow"

[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M"

[custom.pre_commit_warning]
command = "echo '⚠ pre-commit not installed'"
when = 'ls .pre-commit-config.* > /dev/null 2>&1 && { hp=$(git config core.hooksPath 2>/dev/null); hp=${hp:-".git/hooks"}; hp="${hp/#\~/$HOME}"; ! [ -f "$hp/pre-commit" ]; }'
format = "[$output]($style) "
style = "bold red"

[git_status]
conflicted = " conflicted"
ahead = " ahead"
behind = " behind"
diverged = " diverged"
up_to_date = ""
stashed = " stashes"
untracked = " untracked"
modified = "m"
