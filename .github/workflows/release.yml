name: Release

# Every commit on main that passed CI is released: Renovate's tool bumps (and
# everything else) reach users only through a release (`dotfiles update`,
# install.sh, and the sandbox fleet's `go run ...@latest`). The commit gets the
# next patch version; a v* tag pushed by hand is released as it is.
#
# After CI, not next to it: the fleet runs @latest, so a tag must never point
# at a commit whose CI (e2e on Ubuntu and Fedora) failed.
#
# Tag and release happen in this one job: a tag pushed with GITHUB_TOKEN does
# not trigger other workflows.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  # One group, so two runs never build the same release. A pending run that a
  # later one replaces costs nothing: the later run releases a newer commit,
  # which contains the older one.
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tag the commit unless it is released already
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions() { git tag --list 'v*' "$@" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V; }
          tag=$(versions --points-at HEAD | tail -n1)
          if [ -n "$tag" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is released already"
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$tag" ]; then
            latest=$(versions | tail -n1)
            latest=${latest:-v0.0.0}
            # CI runs finish out of order: never release an older commit
            # after a newer one, or @latest would roll the fleet back.
            if [ "$latest" != v0.0.0 ] && git merge-base --is-ancestor HEAD "$latest"; then
              echo "Already contained in $latest"
              echo "release=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            # Nothing for users changed (docs, CI, Renovate config): no release.
            if ! git diff --name-only "$latest" HEAD |
              grep -qvE '(^[^/]+\.md$|^\.github/|^renovate\.json5$|^test/|_test\.go$)'; then
              echo "No user-facing change since $latest"
              echo "release=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            IFS=. read -r major minor patch <<<"${latest#v}"
            tag="v${major}.${minor}.$((patch + 1))"
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "Releasing $tag"
          echo "release=true" >>"$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.tag.outputs.release == 'true'
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
